name: Build XRAW Camera APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  GRADLE_VERSION: '8.5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Verify SDK installation
        run: |
          echo "✓ Android SDK setup complete"
          sdkmanager --list_installed | grep -E "(platform-tools|platforms;android-34|build-tools;34.0.0)" || echo "Warning: Expected packages not found"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend type check
        run: npm run typecheck

      - name: Build frontend (Vite)
        run: npm run build

      - name: Copy frontend to Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Setup Gradle wrapper
        working-directory: android
        run: |
          # Ensure gradle wrapper directory exists
          mkdir -p gradle/wrapper
          
          # Download Gradle wrapper JAR from official Gradle distribution
          # Using the specific version to ensure compatibility
          WRAPPER_JAR_URL="https://github.com/gradle/gradle/raw/v${{ env.GRADLE_VERSION }}/gradle/wrapper/gradle-wrapper.jar"
          echo "Downloading Gradle wrapper JAR from: $WRAPPER_JAR_URL"
          curl -L -o gradle/wrapper/gradle-wrapper.jar "$WRAPPER_JAR_URL"
          
          # Verify the JAR was downloaded
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: Failed to download gradle-wrapper.jar"
            exit 1
          fi
          
          # Make gradlew executable
          chmod +x gradlew
          
          # Verify wrapper files
          ls -lh gradle/wrapper/
          ls -lh gradlew
          
          # Test that gradlew can at least show help
          ./gradlew --version || echo "Gradle wrapper test completed"

      - name: Build debug APK
        if: github.event.inputs.build_type != 'release'
        working-directory: android
        run: |
          echo "Building debug APK..."
          ./gradlew assembleDebug --stacktrace --no-daemon --info
          
          # Verify APK was created
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: Debug APK not found"
            find . -name "*.apk" -type f
            exit 1
          fi
          
          echo "✓ Debug APK built successfully"
          ls -lh app/build/outputs/apk/debug/

      - name: Build release APK
        if: github.event.inputs.build_type == 'release'
        working-directory: android
        run: |
          echo "Building release APK..."
          ./gradlew assembleRelease --stacktrace --no-daemon --info
          
          # Verify APK was created
          if [ ! -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "ERROR: Release APK not found"
            find . -name "*.apk" -type f
            exit 1
          fi
          
          echo "✓ Release APK built successfully"
          ls -lh app/build/outputs/apk/release/

      - name: Verify APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          echo "Verifying APK: $APK_PATH"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "✗ APK not found at: $APK_PATH"
            exit 1
          fi
          
          # Check file size
          SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "✓ APK size: $SIZE bytes"
          
          if [ "$SIZE" -lt 1000000 ]; then
            echo "✗ APK seems too small (< 1MB)"
            exit 1
          fi
          
          echo "✓ APK verification passed"

      - name: Upload debug APK artifact
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: XRAW-Camera-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload release APK artifact
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: XRAW-Camera-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/reports/
            android/build/reports/
            android/app/build/outputs/logs/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Verify SDK installation
        run: |
          echo "✓ Android SDK setup complete"
          sdkmanager --list_installed | grep -E "(platform-tools|platforms;android-34|build-tools;34.0.0)" || echo "Warning: Expected packages not found"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend type check
        run: npm run typecheck

      - name: Setup Gradle wrapper
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          WRAPPER_JAR_URL="https://github.com/gradle/gradle/raw/v${{ env.GRADLE_VERSION }}/gradle/wrapper/gradle-wrapper.jar"
          curl -L -o gradle/wrapper/gradle-wrapper.jar "$WRAPPER_JAR_URL"
          chmod +x gradlew

      - name: Run unit tests
        working-directory: android
        run: |
          echo "Running unit tests..."
          ./gradlew test --stacktrace --no-daemon
          echo "✓ Unit tests completed"
