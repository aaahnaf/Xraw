name: Build XRAW Camera APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  GRADLE_VERSION: '8.5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Diagnose Android SDK environment
        run: |
          echo "=== Android SDK Environment Diagnostics ==="
          echo "ANDROID_HOME: ${ANDROID_HOME:-not set}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-not set}"
          if [ -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}" ]; then
            echo "SDK directory contents:"
            ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || true
          fi
          echo "==========================================="

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            cmdline-tools;latest
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Verify SDK installation
        run: |
          echo "=== Verifying Android SDK Installation ==="
          echo "Installed packages:"
          sdkmanager --list_installed
          
          echo ""
          echo "Checking required packages..."
          
          # Check each required package and fail if missing
          MISSING=0
          
          if ! sdkmanager --list_installed | grep -q "cmdline-tools"; then
            echo "✗ ERROR: cmdline-tools not installed"
            MISSING=1
          else
            echo "✓ cmdline-tools installed"
          fi
          
          if ! sdkmanager --list_installed | grep -q "platform-tools"; then
            echo "✗ ERROR: platform-tools not installed"
            MISSING=1
          else
            echo "✓ platform-tools installed"
          fi
          
          if ! sdkmanager --list_installed | grep -q "platforms;android-34"; then
            echo "✗ ERROR: platforms;android-34 not installed"
            MISSING=1
          else
            echo "✓ platforms;android-34 installed"
          fi
          
          if ! sdkmanager --list_installed | grep -q "build-tools;34.0.0"; then
            echo "✗ ERROR: build-tools;34.0.0 not installed"
            MISSING=1
          else
            echo "✓ build-tools;34.0.0 installed"
          fi
          
          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "✗ SDK verification FAILED: Required packages are missing"
            exit 1
          fi
          
          echo ""
          echo "✓ All required SDK packages verified successfully"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend type check
        run: npm run typecheck

      - name: Build frontend (Vite)
        run: npm run build

      - name: Copy frontend to Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          build-root-directory: android

      - name: Build debug APK
        if: github.event.inputs.build_type != 'release'
        working-directory: android
        run: |
          echo "Building debug APK..."
          ./gradlew assembleDebug --stacktrace --no-daemon --info
          
          # Verify APK was created
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: Debug APK not found"
            find . -name "*.apk" -type f
            exit 1
          fi
          
          echo "✓ Debug APK built successfully"
          ls -lh app/build/outputs/apk/debug/

      - name: Build release APK
        if: github.event.inputs.build_type == 'release'
        working-directory: android
        run: |
          echo "Building release APK..."
          ./gradlew assembleRelease --stacktrace --no-daemon --info
          
          # Verify APK was created
          if [ ! -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "ERROR: Release APK not found"
            find . -name "*.apk" -type f
            exit 1
          fi
          
          echo "✓ Release APK built successfully"
          ls -lh app/build/outputs/apk/release/

      - name: Verify APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          echo "Verifying APK: $APK_PATH"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "✗ APK not found at: $APK_PATH"
            exit 1
          fi
          
          # Check file size
          SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "✓ APK size: $SIZE bytes"
          
          if [ "$SIZE" -lt 1000000 ]; then
            echo "✗ APK seems too small (< 1MB)"
            exit 1
          fi
          
          echo "✓ APK verification passed"

      - name: Upload debug APK artifact
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: XRAW-Camera-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload release APK artifact
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: XRAW-Camera-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/reports/
            android/build/reports/
            android/app/build/outputs/logs/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Diagnose Android SDK environment
        run: |
          echo "=== Android SDK Environment Diagnostics ==="
          echo "ANDROID_HOME: ${ANDROID_HOME:-not set}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-not set}"
          if [ -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}" ]; then
            echo "SDK directory contents:"
            ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || true
          fi
          echo "==========================================="

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            cmdline-tools;latest
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Verify SDK installation
        run: |
          echo "=== Verifying Android SDK Installation ==="
          echo "Installed packages:"
          sdkmanager --list_installed
          
          echo ""
          echo "Checking required packages..."
          
          # Check each required package and fail if missing
          MISSING=0
          
          if ! sdkmanager --list_installed | grep -q "cmdline-tools"; then
            echo "✗ ERROR: cmdline-tools not installed"
            MISSING=1
          else
            echo "✓ cmdline-tools installed"
          fi
          
          if ! sdkmanager --list_installed | grep -q "platform-tools"; then
            echo "✗ ERROR: platform-tools not installed"
            MISSING=1
          else
            echo "✓ platform-tools installed"
          fi
          
          if ! sdkmanager --list_installed | grep -q "platforms;android-34"; then
            echo "✗ ERROR: platforms;android-34 not installed"
            MISSING=1
          else
            echo "✓ platforms;android-34 installed"
          fi
          
          if ! sdkmanager --list_installed | grep -q "build-tools;34.0.0"; then
            echo "✗ ERROR: build-tools;34.0.0 not installed"
            MISSING=1
          else
            echo "✓ build-tools;34.0.0 installed"
          fi
          
          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "✗ SDK verification FAILED: Required packages are missing"
            exit 1
          fi
          
          echo ""
          echo "✓ All required SDK packages verified successfully"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend type check
        run: npm run typecheck

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          build-root-directory: android

      - name: Run unit tests
        working-directory: android
        run: |
          echo "Running unit tests..."
          ./gradlew test --stacktrace --no-daemon
          echo "✓ Unit tests completed"
